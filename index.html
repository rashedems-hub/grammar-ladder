<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="سُلّم القواعد">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>سُلّم القواعد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2430;--mute:#6b7280;--line:#e7e3da;--acc:#2b8bc6;--ok:#1f9d63;--bad:#d1434b;--okbg:#e8f6ee;--badbg:#fdecec;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#eef0f3;--mute:#9aa3af;--line:#2c323b;--okbg:#173326;--badbg:#3a1d20}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.7}
.en,.enb{font-family:Inter,system-ui,sans-serif;direction:ltr;unicode-bidi:isolate}
.en{font-weight:600;color:var(--acc)}
#app{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}
.install{background:var(--okbg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:14px}.install b{display:block;font-size:15px}.install .row{display:flex;gap:8px;margin-top:8px}.install button{padding:6px 12px;border-radius:10px;background:var(--ok);color:#fff;font-weight:600}.install button.x{background:transparent;color:var(--mute)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.top h1{font-size:22px;margin:0;flex:1}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:right}
.act b{display:block;font-size:16px}.act small{color:var(--mute);font-size:13px}
.act.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}.act.main small{color:inherit;opacity:.75}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
.lvl{margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.badge{font-family:Inter;font-weight:700;color:#fff;border-radius:10px;padding:2px 9px;font-size:14px}
.lvl h2{margin:0;font-size:18px;flex:1}.lvl span{color:var(--mute);font-size:13px}
.lesson{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:right}
.num{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid var(--line)}
.num.done{color:#fff;border-color:transparent}
.lesson .t{flex:1;min-width:0}.lesson .t b{display:block;font-size:15px}.lesson .t small{color:var(--mute);font-family:Inter;direction:ltr;display:block;text-align:right}
.score{font-size:13px;color:var(--mute);font-family:Inter}
.ltest{width:100%;border:1.5px dashed var(--line);border-radius:14px;padding:10px;color:var(--mute);font-size:14px}
h3{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.rule p{margin:0 0 10px}.rule p:last-child{margin:0}
.formula{display:flex;flex-direction:column;gap:6px}
.formula div{background:var(--bg);border-radius:10px;padding:8px 12px;font-family:Inter,"IBM Plex Sans Arabic";font-weight:500;direction:ltr;text-align:left;unicode-bidi:plaintext}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.ex:last-child{border:0}
.ex .enb{display:block;font-weight:600;text-align:left}.ex small{color:var(--mute)}
.ex>div{flex:1}
.spk{width:34px;height:34px;flex:none;border-radius:10px;background:var(--bg);font-size:16px}
.mis{padding:10px 0;border-bottom:1px solid var(--line)}.mis:last-child{border:0}
.wrong{color:var(--bad);text-decoration:line-through;display:block;text-align:left}.right{color:var(--ok);font-weight:600;display:block;text-align:left}
.mis small{color:var(--mute)}
.tip{background:linear-gradient(135deg,#fff6df,#fdecc8);color:#5b4310;border:0}
@media (prefers-color-scheme:dark){.tip{background:#33290f;color:#f2dca4}}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;margin-top:10px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}.qhead .bar{flex:1}
.qtype{font-size:13px;color:var(--mute);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--bg);border-radius:8px;padding:0 8px}
.qtext{font-size:20px;font-weight:600;margin-bottom:16px;unicode-bidi:plaintext;text-align:start}
.qtext .enb{display:block;text-align:left}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:8px;font-family:Inter,"IBM Plex Sans Arabic";font-size:16px;unicode-bidi:plaintext}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
input.fill{width:100%;padding:14px 16px;font-size:18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:Inter;direction:ltr;text-align:left;outline:none}
input.fill:focus{border-color:var(--acc)}
.zone{min-height:58px;border:1.5px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr;margin-bottom:12px;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;font-family:Inter;font-weight:500}
.zone .chip{border-color:var(--acc)}
.hint{color:var(--mute);font-size:14px;margin:-8px 0 12px}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.fb b{display:block}.fb .ans{font-family:Inter;direction:ltr;text-align:left;font-weight:600;margin:4px 0}
.big{font-size:54px;font-weight:700;text-align:center;font-family:Inter;margin:6px 0 0}
.center{text-align:center}
.muted{color:var(--mute);font-size:14px}
.wk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.wk:last-child{border:0}
.wk div{flex:1}.cnt{background:var(--badbg);color:var(--bad);font-weight:700;border-radius:8px;padding:0 9px;font-family:Inter}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:monospace;font-size:12px;padding:10px;direction:ltr}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const LEVELS=[
{code:"A1",ar:"مبتدئ",desc:"الأساسات التي لا تُبنى جملة بدونها",c:"#2f9e6e"},
{code:"A2",ar:"أساسي",desc:"الأزمنة البسيطة والتعبير اليومي",c:"#2b8bc6"},
{code:"B1",ar:"متوسط",desc:"الأزمنة التامة والشرط والجمل الموصولة",c:"#7a5cd6"},
{code:"B2",ar:"فوق المتوسط",desc:"المبني للمجهول والكلام المنقول والاستنتاج",c:"#d9822b"},
{code:"C1",ar:"احتراف",desc:"تراكيب متقدمة يستخدمها المتحدث المحترف",c:"#c8434f"}
];
const LESSONS=[];
function L(o){LESSONS.push(o)}

/* ================= A1 ================= */
L({id:"a1-1",lv:0,en:"Verb to be",ar:"فعل الكينونة am / is / are",
goal:"تقول من أنت وكيف حالك وأين أنت بجملة صحيحة.",
r:["في العربية نقول «أنا ممرض» بدون فعل، أما في الإنجليزية فالجملة <b>لا تكتمل</b> بدون فعل. لذلك نستخدم فعل <span class=en>be</span> بمعنى (يكون) لوصف الشخص أو حالته أو مكانه.",
"يتغيّر شكل الفعل حسب الفاعل: <span class=en>am</span> مع I فقط، و<span class=en>is</span> مع المفرد الغائب، و<span class=en>are</span> مع الجمع و you.",
"<b>النفي:</b> نضع <span class=en>not</span> بعد الفعل مباشرة. <b>السؤال:</b> نقدّم الفعل على الفاعل."],
f:["I → am","He / She / It → is","You / We / They → are","نفي: am not · isn't · aren't","سؤال: Am I…? · Is she…? · Are they…?"],
ex:[["I am a paramedic.","أنا مسعف."],["The clinic is open.","العيادة مفتوحة."],["We aren't late.","لسنا متأخرين."],["Is the doctor here?","هل الطبيب هنا؟"]],
m:[["He doctor.","He is a doctor.","لا يُحذف فعل be أبداً كما نحذفه في العربية."],["I is happy.","I am happy.","مع I نستخدم am فقط."],["You is right.","You are right.","you دائماً مع are حتى لو كان المقصود شخصاً واحداً."]],
tip:"اسأل نفسك عند كل جملة: أين الفعل؟ إذا لم تجد فعلاً فغالباً تحتاج am / is / are.",
q:[["mc","I ___ from Saudi Arabia.",["am","is","are"],0,"مع I نستخدم am."],
["mc","My brothers ___ at school.",["is","am","are"],2,"My brothers جمع = they ← are."],
["mc","The patient ___ in room 4.",["are","is","am"],1,"The patient مفرد = he/she ← is."],
["fill","She ___ not tired. (be)",["is"],"She ← is، والنفي is not."],
["fill","___ you a student? (be)",["are"],"في السؤال نقدّم الفعل: Are you…?"],
["mc","اختر الجملة الصحيحة:",["He a nurse.","He is a nurse.","He are a nurse."],1,"لا بد من الفعل is مع he."],
["mc","They ___ at home. (نفي)",["isn't","aren't","amn't"],1,"They ← are، ونفيها aren't."],
["ord","Is the clinic open today?","هل العيادة مفتوحة اليوم؟","السؤال يبدأ بالفعل Is ثم الفاعل the clinic."]]});

L({id:"a1-2",lv:0,en:"Pronouns & possessives",ar:"الضمائر وصفات الملكية",
goal:"تفرّق بين I و me و my وتستخدم كل واحد في مكانه.",
r:["<b>ضمير الفاعل</b> يأتي قبل الفعل ويقوم بالفعل: <span class=en>She works.</span>",
"<b>ضمير المفعول</b> يأتي بعد الفعل أو بعد حرف الجر: <span class=en>Call me. · with them</span>",
"<b>صفة الملكية</b> تأتي قبل الاسم مباشرة: <span class=en>my car · their house</span>. ولغير العاقل نستخدم <span class=en>it / its</span>.",
"انتبه: <span class=en>its</span> = ملكية، و <span class=en>it's</span> = it is."],
f:["فاعل: I · you · he · she · it · we · they","مفعول: me · you · him · her · it · us · them","ملكية: my · your · his · her · its · our · their"],
ex:[["She helps him every day.","هي تساعده كل يوم."],["This is our clinic.","هذه عيادتنا."],["Give it to them.","أعطها لهم."],["The dog wagged its tail.","هزّ الكلب ذيله."]],
m:[["Me and him are friends.","He and I are friends.","في موضع الفاعل نستخدم ضمائر الفاعل، ونضع I في الأخير تأدباً."],["The cat ate it's food.","The cat ate its food.","it's تعني it is وليست ملكية."]],
tip:"اسأل: هل الكلمة تفعل الفعل؟ ← فاعل. هل يقع عليها الفعل؟ ← مفعول. هل بعدها اسم تملكه؟ ← ملكية.",
q:[["mc","___ is my sister.",["Her","She","Hers"],1,"في موضع الفاعل: She."],
["mc","Call ___ tomorrow, please. (أنا)",["I","me","my"],1,"بعد الفعل نستخدم ضمير المفعول me."],
["mc","This is ___ car. (هم)",["they","them","their"],2,"قبل الاسم نستخدم صفة الملكية their."],
["mc","The cat is eating ___ food.",["it's","its","it"],1,"its للملكية بدون فاصلة علوية."],
["fill","I know ___. (هو - مفعول)",["him"],"he في موضع المفعول تصبح him."],
["fill","___ names are Ali and Sara. (نحن)",["our"],"قبل الاسم names نستخدم صفة الملكية our."],
["mc","اختر الجملة الصحيحة:",["Me and him are friends.","He and I are friends.","Him and I are friends."],1,"الفاعل يحتاج ضمائر فاعل: He and I."],
["ord","She gave them her phone number.","أعطتهم رقم هاتفها.","She فاعل، them مفعول، her ملكية قبل الاسم."]]});

L({id:"a1-3",lv:0,en:"Articles a / an / the",ar:"أدوات التعريف والتنكير",
goal:"تختار بين a و an و the أو لا شيء بثقة.",
r:["<span class=en>a / an</span> = نكرة مفردة معدودة (شيء واحد غير محدد). نستخدم <span class=en>an</span> قبل <b>صوت</b> متحرك لا حرف متحرك: <span class=en>an hour</span> (الـ h لا تُنطق) لكن <span class=en>a university</span> (تُنطق يو).",
"<span class=en>the</span> = معرفة: شيء محدد يعرفه المتكلم والسامع، أو ذُكر من قبل، أو فريد من نوعه (<span class=en>the sun</span>).",
"<b>لا أداة</b> عند التعميم بالجمع أو غير المعدود: <span class=en>Doctors help people. · I like coffee.</span>"],
f:["a + صوت ساكن: a car · a university","an + صوت متحرك: an apple · an hour","the + شيء محدد أو مذكور سابقاً","∅ (لا شيء) + تعميم: Cats are cute."],
ex:[["I need an ambulance.","أحتاج سيارة إسعاف."],["I bought a book. The book is great.","اشتريت كتاباً. الكتاب رائع."],["The moon is bright tonight.","القمر ساطع الليلة."],["Water is important.","الماء مهم."]],
m:[["I love the cats. (تعميم)","I love cats.","في العربية نعرّف للتعميم (أحب القطط)، وفي الإنجليزية لا نضع the."],["She is engineer.","She is an engineer.","المهن المفردة تحتاج a/an."]],
tip:"قل الكلمة بصوت عالٍ: هل تبدأ بصوت (آ، إ، أو)؟ ← an. السمع هو الحكم وليس الكتابة.",
q:[["mc","I need ___ ambulance.",["a","an","the"],1,"ambulance تبدأ بصوت متحرك."],
["mc","She is ___ university student.",["a","an"],0,"university تُنطق (يو) وهو صوت ساكن."],
["mc","Wait ___ hour.",["a","an"],1,"الـ h في hour صامتة فتبدأ بصوت متحرك."],
["mc","I bought a book. ___ book is very good.",["A","An","The"],2,"ذُكر الكتاب سابقاً فصار معرفة."],
["mc","___ sun is hot today.",["A","The","(لا شيء)"],1,"الشمس فريدة فنستخدم the."],
["fill","He is ___ engineer.",["an"],"engineer تبدأ بصوت متحرك."],
["mc","الجملة الصحيحة للتعميم (أحب القطط عموماً):",["I love the cats.","I love cats.","I love a cats."],1,"التعميم بالجمع بدون أداة."],
["ord","He is an honest man.","إنه رجل صادق.","honest تبدأ بصوت متحرك لأن الـ h صامتة."]]});

L({id:"a1-4",lv:0,en:"Plurals & this / that",ar:"الجمع وأسماء الإشارة",
goal:"تجمع الأسماء بشكل صحيح وتشير للقريب والبعيد.",
r:["القاعدة العامة: نضيف <span class=en>s</span>. بعد s, sh, ch, x وبعض الكلمات المنتهية بـ o نضيف <span class=en>es</span>: <span class=en>boxes · potatoes</span>.",
"ساكن + y ← ies: <span class=en>baby → babies</span>. لكن متحرك + y ← s فقط: <span class=en>day → days</span>. و f/fe ← ves: <span class=en>knife → knives</span>.",
"جموع شاذة يجب حفظها: <span class=en>man→men · woman→women · child→children · person→people · tooth→teeth · foot→feet · mouse→mice</span>.",
"<span class=en>this / these</span> للقريب (مفرد/جمع)، و <span class=en>that / those</span> للبعيد (مفرد/جمع)."],
f:["قريب: this (مفرد) · these (جمع)","بعيد: that (مفرد) · those (جمع)","ساكن+y → ies · f/fe → ves · s/sh/ch/x → es"],
ex:[["These boxes are heavy.","هذه الصناديق ثقيلة."],["Those children are my nephews.","أولئك الأطفال أبناء أخي."],["This person is new.","هذا الشخص جديد."],["Brush your teeth.","نظّف أسنانك."]],
m:[["two childrens","two children","children جمع أصلاً فلا نضيف s."],["This books are mine.","These books are mine.","مع الجمع نستخدم these."]],
tip:"احفظ الجموع الشاذة كأزواج بصوت عالٍ: man-men, child-children… كررها حتى تصبح تلقائية.",
q:[["mc","one baby, two ___",["babys","babies","babyes"],1,"ساكن + y ← ies."],
["mc","one box, three ___",["boxs","boxes"],1,"بعد x نضيف es."],
["mc","one child, many ___",["childs","childrens","children"],2,"جمع شاذ: children."],
["mc","___ books here are mine.",["This","These","That"],1,"جمع وقريب (here) ← these."],
["mc","Look at ___ star over there!",["this","that","these"],1,"مفرد وبعيد (over there) ← that."],
["fill","one knife, two ___",["knives"],"fe ← ves."],
["fill","one person, ten ___",["people","persons"],"الجمع الشائع people."],
["ord","Those men are my colleagues.","أولئك الرجال زملائي.","those للجمع البعيد، و men جمع man."]]});

L({id:"a1-5",lv:0,en:"Present simple",ar:"المضارع البسيط",
goal:"تتكلم عن عاداتك والحقائق والجداول الثابتة.",
r:["نستخدمه للعادات المتكررة، والحقائق العامة، والجداول: <span class=en>I work at night. · Water boils at 100°C.</span>",
"مع <b>he / she / it</b> نضيف <span class=en>s</span> للفعل: <span class=en>she works</span>. وبعد s, sh, ch, x, o نضيف es: <span class=en>goes, watches</span>. ساكن+y ← ies: <span class=en>studies</span>.",
"<b>النفي والسؤال</b> بالمساعد <span class=en>do / does</span>، وبعده الفعل <b>مجرّد بدون s</b>: <span class=en>She doesn't work. · Does she work?</span>",

L({id:"b2-6",lv:3,en:"Modals of deduction",ar:"أفعال الاستنتاج must / might / can't",
goal:"تعبّر عن درجة يقينك من أمر ما في الحاضر والماضي.",
r:["<span class=en>must</span> = متأكد أنه صحيح (حتماً). <span class=en>can't</span> = متأكد أنه غير صحيح (مستحيل). <span class=en>might / may / could</span> = محتمل.",
"للحاضر: <span class=en>modal + V</span>: <span class=en>He must be tired.</span>",

f:["متأكد إيجاباً: must (have V3)","محتمل: might / may / could (have V3)","متأكد سلباً: can't (have V3)"],
ex:[["He's worked 20 hours. He must be exhausted.","عمل 20 ساعة، لا بد أنه منهك."],["That can't be Ahmed; he's in London.","مستحيل أن يكون أحمد، فهو في لندن."],["She might be at the clinic.","ربما هي في العيادة."],["The ground is wet. It must have rained.","الأرض مبللة، لا بد أنها أمطرت."]],

tip:"تخيّل مقياس يقين: must (100%) ← might (50%) ← can't (0%).",
q:[["mc","He has worked 20 hours. He ___ be exhausted.",["must","can't","might not"],0,"استنتاج قوي إيجابي."],
["mc","That ___ be Ahmed; he is in London now.",["must","can't","should"],1,"مستحيل ← can't."],
["mc","I'm not sure where she is. She ___ be at the clinic.",["must","might","can't"],1,"غير متأكد ← might."],
["mc","The ground is wet. It ___ rained last night.",["must have","can't have","must"],0,"استنتاج عن الماضي ← must have."],
["mc","He ___ seen me; I wasn't there.",["must have","can't have","might"],1,"مستحيل في الماضي ← can't have."],
["fill","Take an umbrella. It ___ rain later. (احتمال)",["might","may","could"],"احتمال ← might/may/could."],
["mc","اختر الجملة الصحيحة:",["She must to be at home.","She must be at home.","She musts be at home."],1,"must + V مجرد."],
["ord","They might have missed the bus.","ربما فاتتهم الحافلة.","might have + V3."]]});

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$("#app");
const KEY="sullam_v1";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const byId={};LESSONS.forEach((l,i)=>{l.idx=i;byId[l.id]=l});
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const yest=()=>{const d=new Date(Date.now()-864e5);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};

/* ---------- state ---------- */
let S={done:{},weak:{},streak:{last:"",n:0},answered:0};
function load(){try{const v=localStorage.getItem(KEY);if(v)S=Object.assign(S,JSON.parse(v))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800)}
const canSpeak="speechSynthesis" in window;
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
window._sp=speak;
const spkBtn=t=>canSpeak?`<button class="spk" onclick='_sp(${JSON.stringify(t).replace(/'/g,"&#39;")})' aria-label="استمع">🔊</button>`:"";
function bumpStreak(){const t=today();if(S.streak.last===t)return;S.streak.n=S.streak.last===yest()?S.streak.n+1:1;S.streak.last=t}
const passedCount=()=>LESSONS.filter(l=>S.done[l.id]&&S.done[l.id].passed).length;
const weakTotal=()=>Object.keys(S.weak).length;

/* ---------- install (PWA) ---------- */
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
let deferredPrompt=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(document.querySelector(".lvl"))home()});
addEventListener("appinstalled",()=>{deferredPrompt=null;toast("تم تثبيت التطبيق ✓")});
function installBanner(){
  if(standalone||S.hideInstall)return "";
  if(deferredPrompt)return `<div class="install"><b>📲 ثبّت التطبيق على جوالك</b>يفتح من الشاشة الرئيسية ويعمل بدون إنترنت.<div class="row"><button onclick="_inst()">تثبيت</button><button class="x" onclick="_hideInst()">لاحقاً</button></div></div>`;
  if(isIOS)return `<div class="install"><b>📲 ثبّت التطبيق على الآيفون</b>اضغط زر المشاركة <b style="display:inline">⬆︎</b> في سفاري ثم اختر «إضافة إلى الشاشة الرئيسية».<div class="row"><button class="x" onclick="_hideInst()">فهمت</button></div></div>`;
  return `<div class="install"><b>📲 ثبّت التطبيق على جوالك</b>من قائمة المتصفح ⋮ اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».<div class="row"><button class="x" onclick="_hideInst()">فهمت</button></div></div>`;
}
window._inst=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;home()};
window._hideInst=()=>{S.hideInstall=true;save();home()};
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* ---------- home ---------- */
function home(){
  scrollTo(0,0);
  const p=passedCount(),pct=Math.round(p/LESSONS.length*100);
  const next=LESSONS.find(l=>!(S.done[l.id]&&S.done[l.id].passed));
  let h=`<div class="top"><h1>سُلّم القواعد</h1><span class="pill">🔥 ${S.streak.last===today()||S.streak.last===yest()?S.streak.n:0} يوم</span></div>
  <div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>تقدّمك</b><span class="muted">${p} من ${LESSONS.length} درساً متقناً</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
  ${installBanner()}
  ${!passedCount()&&!S.placed?`<button class="act main" style="width:100%;margin-bottom:10px;background:${LEVELS[2].c};border-color:transparent" onclick="_go('placement')"><b>📍 اختبار تحديد المستوى</b><small>20 سؤالاً تحدد لك من أي درس تبدأ — 5 دقائق تقريباً</small></button>`:""}
  <div class="hero">
   ${next?`<button class="act main" onclick="_go('lesson','${next.id}')"><b>▶ تابع التعلّم</b><small>${esc(next.ar)}</small></button>`:`<button class="act main" onclick="_go('daily')"><b>🏆 أكملت السلّم</b><small>حافظ عليه بالمراجعة</small></button>`}
   <button class="act" onclick="_go('daily')"><b>📅 مراجعة اليوم</b><small>10 أسئلة من دروسك</small></button>
   <button class="act" onclick="_go('weak')"><b>🎯 نقاط ضعفي</b><small>${weakTotal()?weakTotal()+" سؤالاً للمعالجة":"لا توجد بعد"}</small></button>
   <button class="act" onclick="_go('settings')"><b>💾 حفظ التقدّم</b><small>نسخة احتياطية</small></button>
  </div>`;
  LEVELS.forEach((lv,i)=>{
    const ls=LESSONS.filter(l=>l.lv===i),dn=ls.filter(l=>S.done[l.id]&&S.done[l.id].passed).length;
    h+=`<div class="lvl"><span class="badge" style="background:${lv.c}">${lv.code}</span><h2>${lv.ar}</h2><span>${dn}/${ls.length}</span></div><p class="muted" style="margin:0 0 10px">${lv.desc}</p>`;
    ls.forEach(l=>{const d=S.done[l.id];const ok=d&&d.passed;
      h+=`<button class="lesson" onclick="_go('lesson','${l.id}')"><span class="num ${ok?"done":""}" style="${ok?"background:"+lv.c:""}">${ok?"✓":l.idx+1}</span><span class="t"><b>${esc(l.ar)}</b><small>${esc(l.en)}</small></span>${d?`<span class="score">${d.tries?d.best+"%":"✓"}</span>`:""}</button>`});
    h+=`<button class="ltest" onclick="_go('level',${i})">📝 اختبار مستوى ${lv.code} الشامل (15 سؤالاً)</button>`;
  });
  h+=`<button class="btn sec" style="margin-top:22px" onclick="_go('placement')">📍 ${S.placed?"أعد":""} اختبار تحديد المستوى</button>`;
  app.innerHTML=h;
}

/* ---------- lesson ---------- */
function lesson(id){
  scrollTo(0,0);
  const l=byId[id],lv=LEVELS[l.lv],d=S.done[id];
  let h=`<div class="top"><button class="back" onclick="_go('home')">→</button><h1 style="font-size:19px">${esc(l.ar)}</h1><span class="badge" style="background:${lv.c}">${lv.code}</span></div>
  <div class="card"><div class="muted">الدرس ${l.idx+1} · <span class="enb">${esc(l.en)}</span></div><b>🎯 الهدف:</b> ${esc(l.goal)}${d?`<div class="muted" style="margin-top:6px">${d.tries?`أفضل نتيجة: ${d.best}% ${d.passed?"· متقن ✓":"· تحتاج 80% للإتقان"}`:"متقن عبر اختبار تحديد المستوى ✓ — يمكنك التمرّن للتأكد"}</div>`:""}</div>
  <div class="card rule"><h3>📘 القاعدة</h3>${l.r.map(p=>`<p>${p}</p>`).join("")}</div>
  <div class="card"><h3>🧩 الصيغة — احفظها</h3><div class="formula">${l.f.map(x=>`<div>${esc(x)}</div>`).join("")}</div></div>
  <div class="card"><h3>💬 أمثلة</h3>${l.ex.map(e=>`<div class="ex">${spkBtn(e[0])}<div><span class="enb">${esc(e[0])}</span><small>${esc(e[1])}</small></div></div>`).join("")}</div>
  <div class="card"><h3>⚠️ أخطاء شائعة</h3>${l.m.map(m=>`<div class="mis"><span class="wrong enb">${esc(m[0])}</span><span class="right enb">✓ ${esc(m[1])}</span><small>${esc(m[2])}</small></div>`).join("")}</div>
  <div class="card tip"><h3>💡 سرّ التثبيت</h3>${esc(l.tip)}</div>
  <button class="btn" onclick="_go('quiz','${id}')">ابدأ التمارين (${l.q.length})</button>`;
  const nx=LESSONS[l.idx+1];if(nx)h+=`<button class="btn sec" onclick="_go('lesson','${nx.id}')">الدرس التالي ←</button>`;
  app.innerHTML=h;
}

/* ---------- quiz engine ---------- */
let Q=null;
function makeItem(lid,i){return {lid,i,key:lid+":"+i,q:byId[lid].q[i],retry:false}}
function startQuiz(mode,arg){
  let items=[],title="";
  if(mode==="lesson"){const l=byId[arg];items=shuffle(l.q.map((_,i)=>makeItem(l.id,i)));title=l.ar}
  else if(mode==="level"){const ls=LESSONS.filter(l=>l.lv===arg);let all=[];ls.forEach(l=>l.q.forEach((_,i)=>all.push(makeItem(l.id,i))));items=shuffle(all).slice(0,15);title="اختبار مستوى "+LEVELS[arg].code}
  else if(mode==="weak"){items=shuffle(Object.keys(S.weak).map(k=>{const [a,b]=k.split(":");return byId[a]?makeItem(a,+b):null}).filter(Boolean)).slice(0,15);title="علاج نقاط الضعف"}
  else if(mode==="placement"){LEVELS.forEach((_,lv)=>{shuffle(LESSONS.filter(l=>l.lv===lv)).slice(0,4).forEach(l=>{const c=l.q.map((_,i)=>i).filter(i=>l.q[i][0]!=="ord");items.push(makeItem(l.id,c[Math.floor(Math.random()*c.length)]))})});title="اختبار تحديد المستوى"}
  else if(mode==="daily"){
    const wk=Object.entries(S.weak).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k])=>{const [a,b]=k.split(":");return byId[a]?makeItem(a,+b):null}).filter(Boolean);
    const used=new Set(wk.map(x=>x.key));let pool=[];
    LESSONS.filter(l=>S.done[l.id]).forEach(l=>l.q.forEach((_,i)=>{const k=l.id+":"+i;if(!used.has(k))pool.push(makeItem(l.id,i))}));
    items=shuffle(wk.concat(shuffle(pool).slice(0,10-wk.length)));title="مراجعة اليوم";
  }
  if(!items.length){app.innerHTML=`<div class="top"><button class="back" onclick="_go('home')">→</button><h1>${title}</h1></div><div class="card center"><p>${mode==="weak"?"لا توجد أخطاء مسجّلة بعد 👏<br>كل خطأ تقع فيه في التمارين سيظهر هنا لتعالجه.":"ابدأ بدرس واحد على الأقل حتى تظهر لك أسئلة المراجعة."}</p><button class="btn" onclick="_go('home')">العودة</button></div>`;return}
  Q={mode,arg,title,items,pos:0,total:items.length,first:{},wrong:[]};
  renderQ();
}
function lblType(t){return t==="mc"?"اختر الإجابة الصحيحة":t==="fill"?"اكتب الكلمة الناقصة":"رتّب الكلمات لتكوين جملة صحيحة"}
function renderQ(){
  scrollTo(0,0);
  const it=Q.items[Q.pos],q=it.q,done=Object.keys(Q.first).length;
  const showLesson=Q.mode!=="lesson";
  let h=`<div class="qhead"><button class="back" onclick="_quit()">✕</button><div class="bar"><i style="width:${done/Q.total*100}%"></i></div><span class="pill">${done}/${Q.total}</span></div>
  <div class="card"><div class="qtype"><span>${lblType(q[0])}</span>${it.retry?`<span class="tag">🔁 محاولة ثانية</span>`:""}${showLesson?`<span class="tag">${esc(byId[it.lid].ar)}</span>`:""}</div>`;
  if(q[0]==="mc"){
    const isAr=/[؀-ۿ]/.test(q[1])&&!/___/.test(q[1]);
    h+=`<div class="qtext">${isAr?esc(q[1]):fmtBlank(q[1])}</div>`;
    it.order=it.order||shuffle(q[2].map((_,i)=>i));
    h+=it.order.map(i=>`<button class="opt" data-i="${i}">${esc(q[2][i])}</button>`).join("");
  }else if(q[0]==="fill"){
    h+=`<div class="qtext">${fmtBlank(q[1])}</div><input class="fill" id="fin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب هنا…">`;
  }else{
    const toks=q[1].split(" ");
    if(!it.pool){let s;do{s=shuffle(toks.map((_,i)=>i))}while(toks.length>2&&s.map(i=>toks[i]).join(" ")===q[1]);it.pool=s}
    it.ans=[];
    h+=`<div class="hint">المعنى: ${esc(q[2])}</div><div class="zone" id="zone"></div><div class="pool" id="pool"></div>`;
  }
  h+=`<div id="fbx"></div></div><button class="btn" id="chk" ${q[0]==="fill"?"":"disabled"}>تحقّق</button>`;
  app.innerHTML=h;
  const chk=$("#chk");
  if(q[0]==="mc"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(it.locked)return;app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");it.sel=+b.dataset.i;chk.disabled=false});
  }else if(q[0]==="fill"){
    const f=$("#fin");f.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();chk.click()}};setTimeout(()=>{try{f.focus({preventScroll:true})}catch(e){}},50);
  }else{drawOrder(it)}
  it.locked=false;
  chk.onclick=()=>{if(it.locked){next();return}check(it)};
}
function fmtBlank(s){
  // split Arabic hint in parentheses from English sentence
  const m=s.match(/^(.*?)(\s*\(([^)]*[؀-ۿ][^)]*)\))?\s*$/);
  let en=m?m[1]:s,ar=m&&m[3]?m[3]:"";
  return `<span class="enb">${esc(en).replace(/___/g,'<u style="text-decoration-thickness:2px;color:var(--acc)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}</span>${ar?`<div class="muted" style="font-size:14px;font-weight:400">(${esc(ar)})</div>`:""}`;
}
function drawOrder(it){
  const toks=it.q[1].split(" ");
  const z=$("#zone"),p=$("#pool");
  z.innerHTML=it.ans.map((ti,k)=>`<button class="chip" data-k="${k}">${esc(toks[ti])}</button>`).join("");
  p.innerHTML=it.pool.map((ti,k)=>it.ans.includes(ti)?"":`<button class="chip" data-t="${ti}">${esc(toks[ti])}</button>`).join("");
  z.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(it.locked)return;it.ans.splice(+b.dataset.k,1);drawOrder(it)});
  p.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(it.locked)return;it.ans.push(+b.dataset.t);drawOrder(it)});
  const c=$("#chk");if(c&&!it.locked)c.disabled=it.ans.length!==toks.length;
}
const norm=s=>String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?,]+$/,"");
function check(it){
  const q=it.q;let ok=false,correct="",userTxt="";
  if(q[0]==="mc"){if(it.sel==null)return;ok=it.sel===q[3];correct=q[2][q[3]];userTxt=q[2][it.sel];
    app.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;if(i===q[3])b.classList.add("ok");else if(i===it.sel)b.classList.add("no")});
  }else if(q[0]==="fill"){const v=$("#fin").value;if(!v.trim()){toast("اكتب إجابتك أولاً");return}userTxt=v;ok=q[2].some(a=>norm(a)===norm(v));correct=q[2][0];$("#fin").disabled=true;$("#fin").style.borderColor=ok?"var(--ok)":"var(--bad)";
  }else{const toks=q[1].split(" ");userTxt=it.ans.map(i=>toks[i]).join(" ");ok=userTxt===q[1];correct=q[1];$("#zone").style.borderColor=ok?"var(--ok)":"var(--bad)"}
  it.locked=true;
  const expl=q[0]==="mc"?q[4]:q[3];
  const first=!(it.key in Q.first);
  if(first)Q.first[it.key]=ok;
  S.answered++;
  // weak tracking
  if(!ok){S.weak[it.key]=(S.weak[it.key]||0)+1;if(first)Q.wrong.push({it,userTxt,correct});if(!it.retry&&Q.mode!=="placement")Q.items.push(Object.assign({},it,{retry:true,locked:false,sel:null,order:null,pool:null}))}
  else if(S.weak[it.key]&&(Q.mode!=="lesson"||it.retry)){S.weak[it.key]--;if(S.weak[it.key]<=0)delete S.weak[it.key]}
  save();
  const spoken=q[0]==="ord"?q[1]:(q[0]!=="mc"||/___/.test(q[1]))?fillSentence(q,correct):null;
  $("#fbx").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?pick(["أحسنت! ✓","ممتاز ✓","إجابة صحيحة ✓","رائع ✓"]):"ليست صحيحة ✗"}</b>${ok?"":`<div class="ans">${esc(correct)}</div>`}<div style="display:flex;gap:8px;align-items:center;margin-top:4px">${spoken&&canSpeak?spkBtn(spoken):""}<span>${esc(expl)}</span></div>${!ok&&!it.retry&&Q.mode!=="placement"?`<div class="muted" style="margin-top:6px">🔁 سيعود هذا السؤال في آخر التمرين لتثبيته.</div>`:""}</div>`;
  const c=$("#chk");c.disabled=false;c.textContent=Q.pos+1<Q.items.length?"التالي":"عرض النتيجة";
  setTimeout(()=>$("#fbx").scrollIntoView({behavior:"smooth",block:"nearest"}),30);
}
function fillSentence(q,ans){let s=q[1].replace(/\s*\([^)]*\)\s*$/,"");if(s.includes("→"))s=s.split("→").pop();return s.replace("___",ans).replace(/["“”]/g,"").trim()}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function next(){Q.pos++;if(Q.pos<Q.items.length)renderQ();else result()}
window._quit=()=>{showConfirm()};
function showConfirm(){const fb=$("#fbx");fb.innerHTML=`<div class="fb no"><b>هل تريد إنهاء التمرين؟</b><div class="muted">لن تُحسب النتيجة، لكن أخطاءك محفوظة في نقاط الضعف.</div><button class="btn sec" onclick="_go('home')">نعم، خروج</button><button class="btn" onclick="document.getElementById('fbx').innerHTML=''">متابعة</button></div>`;fb.scrollIntoView({behavior:"smooth",block:"nearest"})}
function result(){
  scrollTo(0,0);
  if(Q.mode==="placement")return placementResult();
  const vals=Object.values(Q.first),c=vals.filter(Boolean).length,pct=Math.round(c/vals.length*100);
  bumpStreak();
  let note="";
  if(Q.mode==="lesson"){const d=S.done[Q.arg]||{best:0,passed:false,tries:0};d.tries++;d.best=Math.max(d.best,pct);if(pct>=80)d.passed=true;S.done[Q.arg]=d;
    note=pct>=80?"🎉 أتقنت هذا الدرس! انتقل للتالي.":"تحتاج 80% لإتقان الدرس. راجع الشرح ثم أعد المحاولة — التكرار هو ما يثبّت القاعدة.";}
  else note=pct>=80?"مستوى ممتاز، القواعد ثابتة عندك.":"أخطاؤك أُضيفت إلى نقاط الضعف — عالجها من الصفحة الرئيسية.";
  save();
  const msg=pct===100?"مثالي! 🏆":pct>=80?"ممتاز 👏":pct>=60?"جيد، اقتربت 💪":"تحتاج مراجعة 📘";
  let h=`<div class="top"><button class="back" onclick="_go('home')">→</button><h1 style="font-size:19px">${esc(Q.title)}</h1></div>
  <div class="card center"><div class="big" style="color:${pct>=80?"var(--ok)":pct>=60?"#d9822b":"var(--bad)"}">${pct}%</div><b>${msg}</b><div class="muted">${c} صحيحة من ${vals.length} من المحاولة الأولى</div><p style="margin:10px 0 0">${note}</p></div>`;
  if(Q.wrong.length){h+=`<div class="card"><h3>📝 راجع أخطاءك</h3>${Q.wrong.map(w=>{const q=w.it.q;return `<div class="mis"><div class="enb" style="text-align:left">${esc(q[0]==="mc"&&!/___/.test(q[1])?"":q[0]==="ord"?q[2]:q[1])}</div>${w.userTxt?`<span class="wrong enb">${esc(w.userTxt)}</span>`:""}<span class="right enb">✓ ${esc(w.correct)}</span><small>${esc(q[0]==="mc"?q[4]:q[3])}</small></div>`}).join("")}</div>`}
  if(Q.mode==="lesson"){const l=byId[Q.arg],nx=LESSONS[l.idx+1];
    if(pct>=80&&nx)h+=`<button class="btn" onclick="_go('lesson','${nx.id}')">الدرس التالي: ${esc(nx.ar)} ←</button>`;
    h+=`<button class="btn ${pct>=80?"sec":""}" onclick="_go('quiz','${Q.arg}')">أعد التمارين</button><button class="btn sec" onclick="_go('lesson','${Q.arg}')">ارجع للشرح</button>`}
  else h+=`<button class="btn" onclick="_go('${Q.mode}'${Q.mode==="level"?","+Q.arg:""})">جولة جديدة</button><button class="btn sec" onclick="_go('home')">الرئيسية</button>`;
  app.innerHTML=h;
}

function placementResult(){
  const per=LEVELS.map(()=>[0,0]);
  Q.items.forEach(it=>{if(it.retry)return;const lv=byId[it.lid].lv;per[lv][1]++;if(Q.first[it.key])per[lv][0]++});
  let start=per.findIndex(p=>p[0]<3);if(start<0)start=LEVELS.length;
  S.placed={start,date:today()};bumpStreak();save();
  const first=LESSONS.find(l=>l.lv===start);
  let h=`<div class="top"><button class="back" onclick="_go('home')">→</button><h1 style="font-size:19px">نتيجة تحديد المستوى</h1></div>
  <div class="card center"><div class="muted">مستواك الحالي</div><div class="big" style="font-size:40px;color:${start?LEVELS[start-1].c:LEVELS[0].c}">${start?LEVELS[start-1].code+" · "+LEVELS[start-1].ar:"مبتدئ"}</div>
  <p style="margin:8px 0 0">${start===0?"ننصحك تبدأ من الدرس الأول — الأساس القوي يختصر عليك الطريق.":start===LEVELS.length?"مستواك متقدم جداً 👏 استخدم اختبارات المستويات ومراجعة اليوم للحفاظ عليه.":"ننصحك تبدأ من مستوى "+LEVELS[start].code+": "+esc(first.ar)+"."}</p></div>
  <div class="card"><h3>📊 نتيجتك في كل مستوى</h3>${per.map((p,i)=>`<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span class="badge" style="background:${LEVELS[i].c}">${LEVELS[i].code}</span><div class="bar" style="flex:1"><i style="width:${p[1]?p[0]/p[1]*100:0}%;background:${LEVELS[i].c}"></i></div><span class="score">${p[0]}/${p[1]}</span></div>`).join("")}<p class="muted" style="margin:8px 0 0">يُعتبر المستوى ناجحاً عند 3 من 4. وأخطاؤك أُضيفت إلى نقاط الضعف.</p></div>`;
  if(start>0&&first)h+=`<button class="btn" onclick="_place(${start})">✓ اعتبر الدروس السابقة متقنة وابدأ من ${esc(first.ar)}</button><button class="btn sec" onclick="_go('lesson','${first.id}')">ابدأ من ${esc(first.ar)} فقط</button>`;
  else if(start===0)h+=`<button class="btn" onclick="_go('lesson','${LESSONS[0].id}')">ابدأ الدرس الأول</button>`;
  else h+=`<button class="btn" onclick="_place(${start})">✓ اعتبر كل الدروس متقنة</button>`;
  h+=`<button class="btn sec" onclick="_go('home')">الرئيسية</button>`;
  app.innerHTML=h;
}
window._place=start=>{LESSONS.filter(l=>l.lv<start).forEach(l=>{if(!(S.done[l.id]&&S.done[l.id].passed))S.done[l.id]={best:0,passed:true,tries:0,placed:true}});save();toast("تم ✓");const f=LESSONS.find(l=>l.lv===start);f?lesson(f.id):home()};

/* ---------- weak & settings ---------- */
function weak(){
  scrollTo(0,0);
  const agg={};Object.entries(S.weak).forEach(([k,v])=>{const id=k.split(":")[0];if(!byId[id])return;agg[id]=(agg[id]||0)+v});
  const rows=Object.entries(agg).sort((a,b)=>b[1]-a[1]);
  let h=`<div class="top"><button class="back" onclick="_go('home')">→</button><h1>نقاط ضعفي</h1></div>`;
  if(!rows.length){h+=`<div class="card center"><p>لا توجد أخطاء مسجّلة 👏<br><span class="muted">كل سؤال تخطئ فيه يُسجَّل هنا، ويُحذف عندما تجيب عليه صحيحاً في المراجعة.</span></p></div><button class="btn" onclick="_go('home')">العودة</button>`;app.innerHTML=h;return}
  h+=`<div class="card"><p class="muted" style="margin:0 0 8px">الدروس مرتبة من الأضعف. الرقم = عدد مرات الخطأ التي لم تُعالج بعد.</p>${rows.map(([id,n])=>`<div class="wk"><span class="cnt">${n}</span><div><b>${esc(byId[id].ar)}</b><div class="muted">${LEVELS[byId[id].lv].code} · ${esc(byId[id].en)}</div></div><button class="pill" onclick="_go('lesson','${id}')">الشرح</button></div>`).join("")}</div>
  <button class="btn" onclick="_go('weakquiz')">🎯 تدرّب على أخطائي الآن</button>`;
  app.innerHTML=h;
}
function settings(){
  scrollTo(0,0);
  let code="";try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){}
  app.innerHTML=`<div class="top"><button class="back" onclick="_go('home')">→</button><h1>حفظ التقدّم</h1></div>
  <div class="card"><p style="margin-top:0">يُحفظ تقدّمك تلقائياً على جوالك. إذا غيّرت الجهاز أو حذفت التطبيق، انسخ هذا الرمز واحتفظ به ثم الصقه في الجهاز الآخر.</p>
  <textarea id="exp" readonly>${code}</textarea><button class="btn" id="cp">📋 انسخ الرمز</button></div>
  <div class="card"><h3>استعادة من رمز</h3><textarea id="imp" placeholder="الصق الرمز هنا"></textarea><button class="btn sec" id="im">استعادة</button></div>
  <div class="card"><h3>إحصائيات</h3><div class="muted">أجبت على ${S.answered} سؤالاً · أتقنت ${passedCount()} درساً · ${weakTotal()} سؤالاً في نقاط الضعف</div></div>`;
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(code);toast("تم النسخ ✓")}catch(e){$("#exp").select();toast("حدّد النص وانسخه يدوياً")}};
  $("#im").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($("#imp").value.trim()))));if(!o.done)throw 0;S=Object.assign({done:{},weak:{},streak:{last:"",n:0},answered:0},o);save();toast("تمت الاستعادة ✓");home()}catch(e){toast("الرمز غير صالح")}};
}

/* ---------- router ---------- */
window._go=(v,a)=>{
  if(v==="home")home();else if(v==="lesson")lesson(a);else if(v==="quiz")startQuiz("lesson",a);
  else if(v==="level")startQuiz("level",a);else if(v==="daily")startQuiz("daily");
  else if(v==="weak")weak();else if(v==="weakquiz")startQuiz("weak");else if(v==="settings")settings();else if(v==="placement")startQuiz("placement");
};
home();
})();
</script>
</body>
</html>
